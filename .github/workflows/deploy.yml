name: CI/CD to Docker Hub

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Add Service
        uses: docker/build-push-action@v5
        with:
          context: ./service-add
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/library-add-service:latest

      - name: Build & Push View Service
        uses: docker/build-push-action@v5
        with:
          context: ./service-view
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/library-view-service:latest

      - name: Build & Push Delete Service
        uses: docker/build-push-action@v5
        with:
          context: ./service-delete
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/library-delete-service:latest

      - name: Build & Push Transaction Service
        uses: docker/build-push-action@v5
        with:
          context: ./service-transaction
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/library-transaction-service:latest

      - name: Build & Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./library-frontend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/library-frontend:latest
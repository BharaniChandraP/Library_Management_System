name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ] 

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push All Services
        run: |
          # Define your service folders and their target image names
          # Note the correct name for the transaction service folder
          services=("service-add" "service-view" "service-delete" "service-issue-return" "library-frontend")
          
          for service in "${services[@]}"; do
            # Map 'service-issue-return' folder to 'library-transaction-service' image name
            if [ "$service" == "service-issue-return" ]; then
              IMAGE_NAME="library-transaction-service"
            else
              IMAGE_NAME="library-${service#service-}"
            fi
            
            echo "Building $IMAGE_NAME from folder $service..."
            docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/$IMAGE_NAME:latest ./$service
            docker push ${{ secrets.DOCKERHUB_USERNAME }}/$IMAGE_NAME:latest
          done
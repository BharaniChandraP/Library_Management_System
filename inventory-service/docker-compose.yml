services:
  db:
    image: postgres:latest
    restart: always
    environment:
      POSTGRES_USER: bharani
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: inventory_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  inventory-service:
    build: .
    ports:
      - "5001:5001"
    environment:
      DB_USER: bharani
      DB_PASSWORD: password123
      DB_HOST: db
      DB_NAME: inventory_db
      DB_PORT: 5432
    depends_on:
      - db

volumes:
  postgres_data: